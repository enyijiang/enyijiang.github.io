short_bio_text_justify: false
short_bio: >-
  <p>
    I am a final-year Computer Science Ph.D. candidate at <a href="https://illinois.edu/" style="text-decoration:none">University of Illinois at Urbana-Champaign</a>, advised by <a href="https://cs.stanford.edu/~sanmi/index.html" style="text-decoration:none">Prof. Sanmi Koyejo</a> and <a href="https://siebelschool.illinois.edu/about/people/faculty/namato" style="text-decoration:none">Prof. Nancy Amato</a>. I am currently a visiting researcher with the <a href="https://stair.cs.stanford.edu/" style="text-decoration:none">Stanford Trustworthy AI Research (STAIR) Lab</a> at Stanford University.
  </p>
  <p>
    My research focuses on AI safety and alignment at the intersection of safety and interpretability research. I am particularly interested in understanding and improving model safety through internal representations—studying when behavioral evaluations fail to capture latent risk, how safety-relevant signals emerge during reasoning, and how these signals can support more reliable monitoring and intervention. More broadly, I am interested in building trustworthy AI systems that remain robust under distribution shift and adversarial conditions, as well as applying machine learning to scientific and societal domains, including climate science and healthcare.
  </p>
  <p>
    <a href="https://wusun.name/" style="font-family: 'Playfair Display', serif; font-style: italic; color: #4B2E83; text-align: center;" title="There’s a gravity I don’t resist." >The past doesn’t define us. ❤️</a>
  </p>

  <p style="
  color: #b76e79; 
  font-family: 'Playfair Display', 'Georgia', serif;
  font-size: 1.1em;
  line-height: 1.6;
  ">
    May we, by God's grace, create beauty, discover essence, and perceive connections.
  </p>
#   <p>
#     Before that, I got my Master of Science degree in the same department. My Master research concentrates on federated learning for healthcare applications, with a focus on federated domain adaptation (FDA) problem both empirically and theoretically, advised by <a href="https://cs.stanford.edu/~sanmi/index.html" style="text-decoration:none">Prof. Sanmi Koyejo</a>. Also, I got a Bachelor of Science degree in Computer Engineering with <a href="https://ece.illinois.edu/admissions/why-ece/honors" style="text-decoration:none">Highest Honors</a> from <a href="https://ece.illinois.edu/" style="text-decoration:none">ECE Department</a> of <a href="https://illinois.edu/" style="text-decoration:none">UIUC</a>. 
#   </p>

