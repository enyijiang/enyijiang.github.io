short_bio: >-
  <p>
    I study AI safety and alignment through models’ internal representations, developing ways to detect hidden risks and intervene while preserving useful capabilities.
  </p>
  <p>
    I am a final-year Computer Science Ph.D. candidate at <a href="https://illinois.edu/">UIUC</a>, advised by <a href="https://cs.stanford.edu/~sanmi/index.html">Prof. Sanmi Koyejo</a> and <a href="https://siebelschool.illinois.edu/about/people/faculty/namato">Prof. Nancy Amato</a>, and a visiting researcher at Stanford’s <a href="https://stair.cs.stanford.edu/">Trustworthy AI Research (STAIR) Lab</a>. My broader interests include robustness under distribution shift and applications in climate science and healthcare.
  </p>

